<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <title>ETL Pipeline Architecture</title>
  <desc>Diagrama del pipeline: EventBridge → Lambda → Step Functions → Glue Transform → Glue Iceberg → S3/Iceberg → Athena</desc>
  <rect width="860" height="480" fill="#0f1117" rx="12"/>
  <text x="430" y="36" text-anchor="middle" fill="#f0f0f0" font-size="15" font-weight="600">Data Engineer Challenge — ETL Pipeline Architecture</text>
  <text x="62" y="80" fill="#888" font-size="10" font-weight="500" text-anchor="middle">TRIGGER</text>
  <rect x="10" y="88" width="104" height="60" rx="8" fill="#1a2640" stroke="#3b6fcf" stroke-width="1.5"/>
  <text x="62" y="113" text-anchor="middle" fill="#6fa3ef" font-size="10" font-weight="600">EventBridge</text>
  <text x="62" y="128" text-anchor="middle" fill="#888" font-size="9">cron(0 12 * * ? *)</text>
  <text x="62" y="141" text-anchor="middle" fill="#888" font-size="9">Daily 12:00 UTC</text>
  <line x1="114" y1="118" x2="148" y2="118" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="282" y="80" fill="#888" font-size="10" font-weight="500" text-anchor="middle">ORCHESTRATION</text>
  <rect x="148" y="88" width="104" height="60" rx="8" fill="#1a2a1a" stroke="#3db85a" stroke-width="1.5"/>
  <text x="200" y="113" text-anchor="middle" fill="#5dd87a" font-size="10" font-weight="600">Lambda</text>
  <text x="200" y="128" text-anchor="middle" fill="#888" font-size="9">cc-de-start-</text>
  <text x="200" y="141" text-anchor="middle" fill="#888" font-size="9">state-machine</text>
  <line x1="252" y1="118" x2="286" y2="118" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="286" y="88" width="104" height="60" rx="8" fill="#2a1a2a" stroke="#c07de0" stroke-width="1.5"/>
  <text x="338" y="110" text-anchor="middle" fill="#d49cf0" font-size="10" font-weight="600">Step Functions</text>
  <text x="338" y="125" text-anchor="middle" fill="#888" font-size="9">cc-de-etl-</text>
  <text x="338" y="138" text-anchor="middle" fill="#888" font-size="9">orchestrator</text>
  <text x="555" y="80" fill="#888" font-size="10" font-weight="500" text-anchor="middle">PROCESSING (AWS Glue 4.0)</text>
  <line x1="390" y1="118" x2="424" y2="118" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="424" y="88" width="120" height="60" rx="8" fill="#2a2010" stroke="#e0a840" stroke-width="1.5"/>
  <text x="484" y="110" text-anchor="middle" fill="#f0c060" font-size="10" font-weight="600">Glue Job #1</text>
  <text x="484" y="124" text-anchor="middle" fill="#888" font-size="9">Transform</text>
  <text x="484" y="138" text-anchor="middle" fill="#888" font-size="9">Filter → Join → Parquet</text>
  <line x1="544" y1="118" x2="578" y2="118" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="578" y="88" width="120" height="60" rx="8" fill="#2a2010" stroke="#e0a840" stroke-width="1.5"/>
  <text x="638" y="110" text-anchor="middle" fill="#f0c060" font-size="10" font-weight="600">Glue Job #2</text>
  <text x="638" y="124" text-anchor="middle" fill="#888" font-size="9">Iceberg Writer</text>
  <text x="638" y="138" text-anchor="middle" fill="#888" font-size="9">Parquet → Iceberg</text>
  <text x="755" y="80" fill="#888" font-size="10" font-weight="500" text-anchor="middle">STORAGE</text>
  <rect x="718" y="88" width="120" height="60" rx="8" fill="#1a2020" stroke="#3dcfcf" stroke-width="1.5"/>
  <text x="778" y="110" text-anchor="middle" fill="#5deaea" font-size="10" font-weight="600">S3 Bucket</text>
  <text x="778" y="124" text-anchor="middle" fill="#888" font-size="9">raw/ curated/</text>
  <text x="778" y="138" text-anchor="middle" fill="#888" font-size="9">iceberg/ scripts/</text>
  <line x1="698" y1="118" x2="716" y2="118" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="424" y="220" width="120" height="55" rx="8" fill="#151d20" stroke="#3dcfcf" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="484" y="241" text-anchor="middle" fill="#5deaea" font-size="9" font-weight="600">S3 raw/</text>
  <text x="484" y="255" text-anchor="middle" fill="#888" font-size="8">battery14_df.csv</text>
  <text x="484" y="267" text-anchor="middle" fill="#888" font-size="8">degrees.csv</text>
  <line x1="484" y1="220" x2="484" y2="150" stroke="#555" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr2)"/>
  <rect x="578" y="220" width="120" height="55" rx="8" fill="#1a1520" stroke="#c07de0" stroke-width="1.5"/>
  <text x="638" y="241" text-anchor="middle" fill="#d49cf0" font-size="9" font-weight="600">Iceberg Table</text>
  <text x="638" y="255" text-anchor="middle" fill="#888" font-size="8">cc_data_engineer_db</text>
  <text x="638" y="267" text-anchor="middle" fill="#888" font-size="8">battery_filtered</text>
  <line x1="638" y1="150" x2="638" y2="220" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="718" y="220" width="120" height="55" rx="8" fill="#20181a" stroke="#e05060" stroke-width="1.5"/>
  <text x="778" y="241" text-anchor="middle" fill="#f07080" font-size="10" font-weight="600">Athena</text>
  <text x="778" y="255" text-anchor="middle" fill="#888" font-size="8">SQL validation</text>
  <text x="778" y="267" text-anchor="middle" fill="#888" font-size="8">294 records ✓</text>
  <line x1="698" y1="247" x2="716" y2="247" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="10" y="220" width="390" height="130" rx="8" fill="#141418" stroke="#333" stroke-width="1"/>
  <text x="205" y="242" text-anchor="middle" fill="#ccc" font-size="11" font-weight="600">Transformation Logic (glue_transform.py)</text>
  <text x="30" y="265" fill="#888" font-size="10">Filters applied:</text>
  <text x="30" y="283" fill="#5dd87a" font-size="10">●  gender == 'f'  →  mapped to 'Female'</text>
  <text x="30" y="299" fill="#5dd87a" font-size="10">●  age &gt; 30</text>
  <text x="30" y="315" fill="#5dd87a" font-size="10">●  country == 'US'</text>
  <text x="30" y="331" fill="#5dd87a" font-size="10">●  education_level &gt; 6  (higher than Master's)</text>
  <text x="220" y="331" fill="#666" font-size="9"> → join with degrees.csv</text>
  <text x="30" y="347" fill="#5dd87a" font-size="10">●  raw_score &gt; 300</text>
  <rect x="290" y="317" width="100" height="26" rx="5" fill="#1a2a1a" stroke="#3db85a" stroke-width="1"/>
  <text x="340" y="334" text-anchor="middle" fill="#5dd87a" font-size="11" font-weight="700">294 records</text>
  <rect x="10" y="365" width="840" height="45" rx="8" fill="#141418" stroke="#333" stroke-width="1"/>
  <text x="430" y="382" text-anchor="middle" fill="#888" font-size="10" font-weight="500">Infrastructure as Code — AWS SAM (CloudFormation)</text>
  <text x="430" y="400" text-anchor="middle" fill="#666" font-size="9">template.yaml  ·  sam build  ·  sam deploy  ·  stack: cc-data-engineer-etl  ·  region: us-east-1</text>
  <rect x="10" y="422" width="840" height="48" rx="8" fill="#0d0f14" stroke="#333" stroke-width="1"/>
  <rect x="22" y="436" width="10" height="10" rx="2" fill="#1a2640" stroke="#3b6fcf" stroke-width="1.5"/>
  <text x="38" y="446" fill="#888" font-size="9">Trigger</text>
  <rect x="90" y="436" width="10" height="10" rx="2" fill="#1a2a1a" stroke="#3db85a" stroke-width="1.5"/>
  <text x="106" y="446" fill="#888" font-size="9">Compute</text>
  <rect x="168" y="436" width="10" height="10" rx="2" fill="#2a1a2a" stroke="#c07de0" stroke-width="1.5"/>
  <text x="184" y="446" fill="#888" font-size="9">Orchestration</text>
  <rect x="262" y="436" width="10" height="10" rx="2" fill="#2a2010" stroke="#e0a840" stroke-width="1.5"/>
  <text x="278" y="446" fill="#888" font-size="9">Processing</text>
  <rect x="345" y="436" width="10" height="10" rx="2" fill="#1a2020" stroke="#3dcfcf" stroke-width="1.5"/>
  <text x="361" y="446" fill="#888" font-size="9">Storage (S3)</text>
  <rect x="428" y="436" width="10" height="10" rx="2" fill="#1a1520" stroke="#c07de0" stroke-width="1.5"/>
  <text x="444" y="446" fill="#888" font-size="9">Iceberg / Catalog</text>
  <rect x="535" y="436" width="10" height="10" rx="2" fill="#20181a" stroke="#e05060" stroke-width="1.5"/>
  <text x="551" y="446" fill="#888" font-size="9">Query / Validation</text>
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#666"/>
    </marker>
    <marker id="arr2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>

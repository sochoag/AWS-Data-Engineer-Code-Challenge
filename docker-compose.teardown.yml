version: '3.8'

# =============================================================================
#  docker-compose.teardown.yml — Removes all AWS resources created by the challenge
#
#  Usage:
#    docker compose -f docker-compose.teardown.yml run --rm teardown
#
#  What it does:
#    1. Empties the S3 bucket (objects + versions) — required before CF deletion
#    2. Runs `sam delete` to remove the entire CloudFormation stack
#
#  Requires the same .env as docker-compose.yml.
# =============================================================================

services:
  teardown:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
    working_dir: /workspace
    stdin_open: true    # required for the interactive y/n confirmation
    tty: true
    env_file:
      - .env
    environment:
      STACK_NAME: ${STACK_NAME:-cc-data-engineer-etl}
    command: bash teardown_entrypoint.sh
